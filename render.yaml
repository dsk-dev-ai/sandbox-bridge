services:
  - type: web
    name: proving-ground
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /demo
    autoDeploy: true
    envVars:
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DEMO_ALERT_COOLDOWN_SECONDS
        value: "180"
      # Secrets: Render prompts for these when the Blueprint is applied.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_TO_EMAIL
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: APP_URL
        value: https://proving-ground.onrender.com
    disk:
      name: proving-ground-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

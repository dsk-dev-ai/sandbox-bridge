name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test the demo endpoints
        run: |
          PORT=3100 npm start > /tmp/proving-ground.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/demo > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/demo)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3100/api/demo/checkout?mode=healthy')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:3100/api/demo/checkout?mode=broken')" = "503"
          curl -s 'http://localhost:3100/api/demo/checkout?mode=broken' | grep -q PAYMENT_PROVIDER_UNAVAILABLE
